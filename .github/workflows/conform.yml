name: conform

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      first:
        description: First sweep seed (default rotates daily)
        required: false
  workflow_call:
    inputs:
      scripted:
        description: Run seeds 0 to 39 with the scripted traces, as the gate workflow does
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUN: ^TestPeeringKeepsAcknowledgedWritesAcrossPrimaries$|^TestConformReplacementSeeds$
  COUNT: "500"
  # Plants run from seed 0: conform.sh fails a caught plant that fires on none of seeds 0 to 39, the
  # nightly run's 40, which take 1 h 47 m on the SYS-2. The gate's 10 take about a quarter of that;
  # every caught plant is rejected on one of them, and one that stops firing there gives no evidence
  # instead of failing until that night.
  PLANT_COUNT: "40"
  GATE_PLANT_COUNT: "10"
  # The SYS-2 runs a trace about half as fast as the M4 Pro, and a trace that passes in 1,200 s there
  # gets 40 minutes here: seed 391795 passes in 549 s on the M4 Pro and gave no verdict in 20 minutes. A
  # sweep of 1,000 traces takes about 80 minutes. Its runner has 8 threads and 20 GB: 6 traces of 2 GB
  # heap at once.
  TLC_SECONDS: "2400"
  JOBS: "6"
  # 320 minutes, inside the jobs' timeout of 340: a run slowed by traces that give no verdict still
  # prints every line before the job ends.
  DEADLINE: "19200"

jobs:
  # On the SYS-2, never for a pull request: a fork's code must not run on it. The box has two runners
  # in one capped slice: a gate's jobs take sys2-gate, so they never wait behind a nightly's hours.
  traces:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        mode: [sweep, plants]
    runs-on: [self-hosted, "${{ inputs.scripted && 'sys2-gate' || 'sys2' }}"]
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - id: seeds
        env:
          INPUT_FIRST: ${{ inputs.first }}
          SCRIPTED: ${{ inputs.scripted }}
        # The gate runs seeds 0 to 39 with the scripted traces; a nightly run sweeps new ones.
        run: |
          if [ "$SCRIPTED" = true ]; then
            printf 'first=0\ncount=40\nrun=TestConform|%s\n' "$RUN" >>"$GITHUB_OUTPUT"
            exit
          fi
          first=$INPUT_FIRST
          echo "first=${first:-$(( $(date -u +%s) / 86400 % 2000 * COUNT + 40 ))}" >>"$GITHUB_OUTPUT"
          printf 'count=%s\nrun=%s\n' "$COUNT" "$RUN" >>"$GITHUB_OUTPUT"
      - name: sweep
        if: matrix.mode == 'sweep'
        env:
          FIRST: ${{ steps.seeds.outputs.first }}
          COUNT: ${{ steps.seeds.outputs.count }}
          RUN: ${{ steps.seeds.outputs.run }}
        run: |
          echo "Seeds $FIRST to $((FIRST + COUNT - 1)); replay one: RUN='$RUN' FIRST=<seed> COUNT=1 scripts/conform.sh" | tee -a "$GITHUB_STEP_SUMMARY"
          status=0
          scripts/conform.sh >conform.log 2>&1 || status=$?
          cat conform.log
          grep -v '^ok' conform.log >>"$GITHUB_STEP_SUMMARY" || true
          exit $status
      - name: plants
        if: matrix.mode == 'plants'
        env:
          FIRST: "0"
          COUNT: ${{ inputs.scripted && env.GATE_PLANT_COUNT || env.PLANT_COUNT }}
        run: |
          echo "Plants on seeds $FIRST to $((FIRST + COUNT - 1))" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/conform.sh plants 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
