[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["exercises", "spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/nvcnvn/rock-solid"
publish = false

[workspace.dependencies]
crc = { version = "3.4.0", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
rc_buffer = "warn"
lossy_float_literal = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
