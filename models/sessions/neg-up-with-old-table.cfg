    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 4
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 1
    MaxCrashes = 1
    MaxPartitions = 1
    MaxWrites = 3
    MaxInFlight = 2
    MaxLost = 1
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
