\* One client renewing with leaders on two control-plane nodes over 2 terms; raw rates of 16 or 20 units a tick, lease_drift 1/8, an 80-unit session lease (about 4.4 ticks) and dead_wait 100 units; a VM stop with its clocks frozen.
