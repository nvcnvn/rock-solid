\* One client renewing with leaders on two control-plane nodes over 2 terms; raw rates of 8 or 10 units a tick, a 34-unit session lease (about 4 ticks) and lease_drift 1/4; a VM stop with its clocks frozen.
SPECIFICATION Spec
CONSTANTS
    Clients = {1}
    Leaders = {A, B}
    Storage = {}
    Rates = {8, 10}
    SessionLease = 34
    DriftNum = 1
    DriftDen = 4
    Cap = 44
    DownAfter = 2
    Windows = TRUE
    WithLock = FALSE
    MaxTerms = 2
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxWrites = 0
    MaxInFlight = 0
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoSpuriousTrip
