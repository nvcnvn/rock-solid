\* As ci-out-of-service with no VM stop, two storage nodes and a control-plane failover, so the new session's start races the fact's commit across a change of leader as well.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A, B}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 3
    DeadWait = 3
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 2
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxWrites = 2
    MaxInFlight = 1
    MaxLost = 0
    NewSessions = {2}
    OnNode = {1, 2}
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
    UnmeasuredWaitsDeadWait = TRUE
    RefuseStarts = TRUE
    StartChecksFact = TRUE
    FactChecksHead = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
    NoWriteAfterOutOfService
