\* Two clients contending for one lock, one leader, two storage nodes in one PG; rate 1, a 3-tick session lease and lease_drift 1/4; up to 2 writes in flight per client and 3 in all, a VM stop, an eviction, a client crash, a storage node partitioned from the control plane and a lost message.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 4
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 1
    MaxCrashes = 1
    MaxPartitions = 1
    MaxWrites = 3
    MaxInFlight = 2
    MaxLost = 1
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
