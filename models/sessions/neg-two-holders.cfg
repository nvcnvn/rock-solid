\* expect: AtMostOneHolder
\* An eviction fences the holder at once: it still holds its lease and acts on the lock after the next holder got it.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 4
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 1
    MaxCrashes = 0
    MaxPartitions = 1
    MaxWrites = 2
    MaxInFlight = 2
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = FALSE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    MarginOverVoters = TRUE
    RestartWait = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    AtMostOneHolder
