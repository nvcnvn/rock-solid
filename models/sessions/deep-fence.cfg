\* As ci-fence with a second leader term on another node, plus a crashed client's eventual fence and release under fairness.
SPECIFICATION FairSpec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A, B}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 4
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 2
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 1
    MaxCrashes = 1
    MaxPartitions = 1
    MaxWrites = 3
    MaxInFlight = 2
    MaxLost = 1
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
PROPERTIES
    CrashedClientReleased
