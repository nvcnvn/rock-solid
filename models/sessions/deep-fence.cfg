\* As ci-fence with one write in flight per client, a second leader term on another node and a client daemon that dies; safety only, deep-release checks the liveness.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A, B}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 3
    DeadWait = 3
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 2
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 1
    MaxPartitions = 1
    MaxWrites = 2
    MaxInFlight = 1
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
