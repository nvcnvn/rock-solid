\* One client holding the lock on a node an operator marks out of service, fenced once it stops renewing, its VM stopped or not, and the new session it then tries to start, which the lock passes to; one leader, one storage node; rate 1, a 3-tick session lease and lease_drift 1/4; up to 2 writes, one in flight per client.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A}
    Storage = {1}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 3
    DeadWait = 3
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxWrites = 2
    MaxInFlight = 1
    MaxLost = 0
    NewSessions = {2}
    OnNode = {1, 2}
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
    UnmeasuredWaitsDeadWait = TRUE
    RefuseStarts = TRUE
    StartChecksFact = TRUE
    FactChecksHead = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
    NoWriteAfterOutOfService
