    Clients = {1, 2}
    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 2
    DriftNum = 1
    DriftDen = 4
    Cap = 2
    DownAfter = 1
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 2
    MaxWrites = 2
    MaxInFlight = 1
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = FALSE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
