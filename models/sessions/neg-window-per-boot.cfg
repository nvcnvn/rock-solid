\* expect: NoSpuriousTrip
\* The client keeps one rate bound per leader node, not per boot: the node reboots at another rate, and the step check trips on its first grant against the old boot's bound.
SPECIFICATION Spec
CONSTANTS
    Clients = {1}
    Leaders = {A}
    Storage = {}
    Rates = {16, 20}
    SessionLease = 81
    DriftNum = 1
    DriftDen = 8
    Cap = 81
    DeadWait = 102
    DownAfter = 2
    Windows = TRUE
    WithLock = FALSE
    MaxTerms = 2
    MaxReboots = 1
    MaxRises = 1
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxWrites = 0
    MaxInFlight = 0
    MaxLost = 1
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerBoot = FALSE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoSpuriousTrip
