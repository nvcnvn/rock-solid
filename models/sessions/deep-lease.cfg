\* As ci-lease with a 145-unit session lease (about 8 ticks) and dead_wait 182 units, so leases overlap failovers part-way through.
SPECIFICATION Spec
CONSTANTS
    Clients = {1}
    Leaders = {A, B}
    Storage = {}
    Rates = {16, 20}
    SessionLease = 145
    DriftNum = 1
    DriftDen = 8
    Cap = 145
    DeadWait = 182
    DownAfter = 2
    Windows = TRUE
    WithLock = FALSE
    MaxTerms = 2
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxWrites = 0
    MaxInFlight = 0
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoSpuriousTrip
