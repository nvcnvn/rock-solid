\* expect: NoFencedWriteApplied
\* A storage node checks the fence only on a write's arrival: a write queued before it applied the fence is applied after.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 3
    DeadWait = 3
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 0
    MaxStalls = 0
    MaxEvicts = 0
    MaxCrashes = 0
    MaxPartitions = 1
    MaxWrites = 2
    MaxInFlight = 2
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = FALSE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoFencedWriteApplied
