\* As ci-fence with no partition and one write in flight per client, and a VM stop, a leader stall, an eviction and a client daemon that dies.
SPECIFICATION Spec
CONSTANTS
    Clients = {1, 2}
    Leaders = {A}
    Storage = {1, 2}
    Rates = {1}
    SessionLease = 3
    DriftNum = 1
    DriftDen = 4
    Cap = 3
    DeadWait = 3
    DownAfter = 2
    Windows = FALSE
    WithLock = TRUE
    MaxTerms = 1
    MaxReboots = 0
    MaxRises = 0
    MaxStops = 1
    MaxStalls = 1
    MaxEvicts = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxWrites = 2
    MaxInFlight = 1
    MaxLost = 0
    CountFromSend = TRUE
    EndDriftEarly = TRUE
    EndOnResumed = TRUE
    AnswerWithLease = TRUE
    FullLeaseOnFailover = TRUE
    WindowPerRun = TRUE
    StepAtMargin = TRUE
    EvictWaitsLease = TRUE
    ReleaseOnAck = TRUE
    CheckWhenOrdered = TRUE
    ReplicaChecks = TRUE
    UpNeedsCurrent = TRUE
    PeeringStops = TRUE
    AckNeedsEveryNode = TRUE
    DownCountsAsAck = TRUE
    CountOnHolder = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceWhileLeased
    NoFencedWriteApplied
    LockOrder
    AtMostOneHolder
    FenceReleasedInTime
