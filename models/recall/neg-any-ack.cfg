\* expect: NoStaleReadWriteShared
\* Acknowledgments do not name the owner's term: a delayed one, sent before an owner failover, stands for the new owner's recall, which the node never saw.
SPECIFICATION Spec
CONSTANTS
    Nodes = {a, b}
    Regions = {0}
    MaxHandles = 1
    MaxWrites = 2
    MaxFailovers = 1
    MaxLost = 1
    MaxPauses = 1
    MaxLapses = 1
    RecallFlush = TRUE
    RecallDrop = TRUE
    RecallDirect = TRUE
    RecallReval = TRUE
    AnswerAfterRecall = TRUE
    NoTimeoutAnswer = TRUE
    AckNamesTerm = FALSE
    AttrWithinLease = TRUE
    EvictWaitsLease = TRUE
    GraceBlocksOpens = TRUE
    GraceUntilReregistered = TRUE
    ReregCarriesWrote = TRUE
    StayWriteShared = TRUE
    SizeBeforeAck = TRUE
    KeepCacheCheck = TRUE
    OpenRecallsHolder = TRUE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    NoStaleReadWriteShared
