\* expect: NoStaleReadWriteShared
\* A second node's open of an Exclusive file recalls only a holder the owner knows has written: the holder's first write, which the owner never saw, stays in its buffer and cache, and the file goes ReadShared.
SPECIFICATION Spec
CONSTANTS
    Nodes = {a, b, c}
    Regions = {0}
    MaxHandles = 1
    MaxWrites = 2
    MaxFailovers = 0
    MaxLost = 0
    MaxPauses = 0
    MaxLapses = 0
    RecallFlush = TRUE
    RecallDrop = TRUE
    RecallDirect = TRUE
    RecallReval = TRUE
    AnswerAfterRecall = TRUE
    NoTimeoutAnswer = TRUE
    AckNamesTerm = TRUE
    AttrWithinLease = TRUE
    EvictWaitsLease = TRUE
    GraceBlocksOpens = TRUE
    GraceUntilReregistered = TRUE
    ReregCarriesWrote = TRUE
    StayWriteShared = TRUE
    SizeBeforeAck = TRUE
    KeepCacheCheck = TRUE
    OpenRecallsHolder = FALSE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    NoStaleReadWriteShared
