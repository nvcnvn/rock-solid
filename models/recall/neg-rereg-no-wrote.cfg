\* expect: NoStaleReadWriteShared
\* A re-registration does not say the node has written: the new owner computes ReadShared, and new opens cache.
SPECIFICATION Spec
CONSTANTS
    Nodes = {a, b}
    Regions = {0}
    MaxHandles = 1
    MaxWrites = 2
    MaxFailovers = 1
    MaxLost = 1
    MaxPauses = 1
    MaxLapses = 1
    RecallFlush = TRUE
    RecallDrop = TRUE
    RecallDirect = TRUE
    RecallReval = TRUE
    AnswerAfterRecall = TRUE
    NoTimeoutAnswer = TRUE
    AckNamesTerm = TRUE
    AttrWithinLease = TRUE
    EvictWaitsLease = TRUE
    GraceBlocksOpens = TRUE
    GraceUntilReregistered = TRUE
    ReregCarriesWrote = FALSE
    StayWriteShared = TRUE
    SizeBeforeAck = TRUE
    KeepCacheCheck = TRUE
    OpenRecallsHolder = TRUE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    NoStaleReadWriteShared
