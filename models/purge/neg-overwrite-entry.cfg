\* expect: NoChunkOfDeletedInode
\* A new purge range overwrites a pending one: a truncate then an unlink leaks the truncated chunks.
SPECIFICATION Spec
CONSTANTS
    Inodes = {1, 2, 3}
    Nodes = {a}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 7
    WriteOffsets = {}
    TruncSizes = {1, 5}
    MaxWrites = 0
    MaxTruncates = 2
    MaxUnlinks = 2
    MaxCrashes = 2
    MaxFences = 0
    MaxFailovers = 0
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    ZeroGapOnExtend = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = FALSE
    CheckedRemoval = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoChunkOfDeletedInode
