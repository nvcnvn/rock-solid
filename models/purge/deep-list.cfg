\* As ci-list with 3 crashes; safety only, since its liveness check does not finish in 4 hours (deep-write and deep-orphan check PurgeSettles).
SPECIFICATION Spec
CONSTANTS
    Inodes = {1, 2, 3}
    Nodes = {a}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 7
    WriteOffsets = {}
    TruncSizes = {1, 5}
    MaxWrites = 0
    MaxTruncates = 2
    MaxUnlinks = 2
    MaxCrashes = 3
    MaxFences = 0
    MaxFailovers = 0
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    ZeroGapOnExtend = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RerunSafe
    NeverDeletesNewer
    TruncatedBytesZero
    ExtensionNeverExposes
    NoChunkOfDeletedInode
    OrphanNotFreedWhileOpen
