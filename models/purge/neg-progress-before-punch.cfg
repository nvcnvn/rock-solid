\* expect: NeverDeletesNewer
\* The purger records progress through an entry while its punch is in flight: a successor resumes past that chunk, and the old punch lands after the file was extended and written there.
SPECIFICATION Spec
CONSTANTS
    Inodes = {1}
    Nodes = {a, b}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 7
    WriteOffsets = {2, 6}
    TruncSizes = {1, 5, 8}
    MaxWrites = 2
    MaxTruncates = 2
    MaxUnlinks = 0
    MaxCrashes = 2
    MaxFences = 0
    MaxFailovers = 0
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
    DrainBeforePurge = TRUE
    ProgressAfterPunch = FALSE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    NeverDeletesNewer
