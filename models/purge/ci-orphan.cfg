\* One inode of 2 chunks of 2 blocks of 2 bytes, 3 bytes long, open on two nodes, written past alloc_end and unlinked, with a fence, an owner failover and a crash.
SPECIFICATION Spec
CONSTANTS
    Inodes = {1}
    Nodes = {a, b}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 3
    WriteOffsets = {5}
    TruncSizes = {}
    MaxWrites = 2
    MaxTruncates = 0
    MaxUnlinks = 1
    MaxCrashes = 1
    MaxFences = 1
    MaxFailovers = 1
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    ZeroGapOnExtend = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RerunSafe
    NeverDeletesNewer
    TruncatedBytesZero
    ExtensionNeverExposes
    NoChunkOfDeletedInode
    OrphanNotFreedWhileOpen
