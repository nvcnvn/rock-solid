\* expect: NeverDeletesNewer
\* The truncating daemon sends the first punch itself: it lands after the purger finished and another node extended the file.
SPECIFICATION Spec
CONSTANTS
    Inodes = {1}
    Nodes = {a, b}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 7
    WriteOffsets = {2, 6}
    TruncSizes = {3, 5, 8}
    MaxWrites = 2
    MaxTruncates = 2
    MaxUnlinks = 0
    MaxCrashes = 2
    MaxFences = 0
    MaxFailovers = 0
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = TRUE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    ZeroGapOnExtend = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    NeverDeletesNewer
