\* One inode of 2 chunks of 2 blocks of 2 bytes, 7 bytes long, written from two nodes while it is truncated down and up, with daemon and purger crashes.
SPECIFICATION Spec
CONSTANTS
    Inodes = {1}
    Nodes = {a, b}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 7
    WriteOffsets = {2, 6}
    TruncSizes = {3, 5, 8}
    MaxWrites = 2
    MaxTruncates = 2
    MaxUnlinks = 0
    MaxCrashes = 2
    MaxFences = 0
    MaxFailovers = 0
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    ZeroGapOnExtend = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
SYMMETRY NodeSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RerunSafe
    NeverDeletesNewer
    TruncatedBytesZero
    ExtensionNeverExposes
    NoChunkOfDeletedInode
    OrphanNotFreedWhileOpen
