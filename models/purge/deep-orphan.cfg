\* As ci-orphan with 3 writes and 2 crashes, plus every purge entry settling under a fair purger.
SPECIFICATION FairSpec
CONSTANTS
    Inodes = {1}
    Nodes = {a, b}
    BlockBytes = 2
    ChunkBlocks = 2
    Chunks = 2
    InitSize = 3
    WriteOffsets = {5}
    TruncSizes = {}
    MaxWrites = 3
    MaxTruncates = 0
    MaxUnlinks = 1
    MaxCrashes = 2
    MaxFences = 1
    MaxFailovers = 1
    TruncEntryAtByte = TRUE
    MergePartialBlock = TRUE
    MemoryTail = FALSE
    DaemonPunch = FALSE
    ExtendFinishesPurge = TRUE
    RewriteAfterCheck = TRUE
    RaiseBeforeWrite = TRUE
    MissingPunchSucceeds = TRUE
    PurgerTermFence = TRUE
    IncarnationFence = TRUE
    OrphanWhileOpen = TRUE
    OrphanAfterGrace = TRUE
    GraceUntilReregistered = TRUE
    ReleaseOnAck = TRUE
    MergeEntries = TRUE
    CheckedRemoval = TRUE
    DrainBeforePurge = TRUE
    ProgressAfterPunch = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RerunSafe
    NeverDeletesNewer
    TruncatedBytesZero
    ExtensionNeverExposes
    NoChunkOfDeletedInode
    OrphanNotFreedWhileOpen
PROPERTIES
    PurgeSettles
