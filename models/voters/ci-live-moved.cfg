\* Voter c's drive moved, c leading the joint configuration with every replica up: c commits and applies its own removal, and after the swap the group has a leader in Plan, up to term 2, no crash. Lease reads never overlap.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OwnTermFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- OutgoingInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    DeletesOnlyRemoved
    OneLeaseReader
PROPERTY
    NewLeader
