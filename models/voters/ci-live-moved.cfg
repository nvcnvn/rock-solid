\* Voter c's drive moved, c having won term 2 on every replica while joint, every replica up: c leaves the joint configuration and applies its own removal, and after the swap the group has a leader in Plan, up to term 3, no crash. Lease reads never overlap and see every committed entry. The start, OutgoingInit, is one Spec step from JointInit: FairSpec lets nobody campaign while a replica leads, an assumption about what follows the start, not about how the group got there.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- OutgoingInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    LearnsOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
PROPERTY
    NewLeader
