\* Voter c's drive moved: from the joint configuration with every replica up, the leader may crash and restart and leaders hand off; after the swap the group has a leader in Plan, up to term 3. Lease reads never overlap.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OwnTermFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    DeletesOnlyRemoved
    OneLeaseReader
PROPERTY
    NewLeader
