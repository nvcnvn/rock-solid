\* expect: NewLeader
\* ci-halt-live with RemovedWaitsForPlan off: a commits the leave with b, tells c and halts, handing its leadership to b, which holds the leave but applied only the joint configuration; c applies its removal and deletes its state, so b's outgoing half, a halted and c gone, never commits.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 0
    MaxHalts = 1
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = FALSE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
PROPERTY
    NewLeader
