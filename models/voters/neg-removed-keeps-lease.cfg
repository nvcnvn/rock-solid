\* expect: OneLeaseReader
\* ci-live-moved with RemovedStopsLease off: a leader that applied its own removal still counts the support its followers withdrew, and reads while the next leader does.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OwnTermFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = FALSE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANT
    OneLeaseReader
