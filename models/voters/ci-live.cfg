\* A swap completes with a fair run on two voters and a third planned, no fault and no bound on messages, so a pair reorders.
SPECIFICATION LiveSpec
CONSTANTS
    Replica = {1, 2, 3}
    InitVoters = {1, 2}
    InitLearners = {}
    Plan = {1, 3}
    Values = {}
    Poison = 0
    CannotDecode = {}
    Events = {}
    Candidates = {}
    MaxTerm = 0
    MaxMsgs = 0
    MaxLink = 0
    MaxCrash = 0
    MaxEpoch = 0
    Bugs = {}
CHECK_DEADLOCK TRUE
INVARIANTS
    OneLeaderPerTerm
    CommittedSurvive
    ReadsAcked
    OneReader
    NoWrongfulDeletion
    HeldAfterDeletion
    PromotedHolds
    HaltStops
    Restarts
PROPERTY
    Stops
