\* Voters a, b and c, the plan swapping d in for c, c leading the joint configuration, up to term 2, no crash: a removed leader's lease reads.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OwnTermFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- OutgoingInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    DeletesOnlyRemoved
    OneLeaseReader
