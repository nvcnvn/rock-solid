\* Voters a, b and c, the plan swapping d in for c, a leading the joint configuration (JointInit, which Spec reaches from Init with no crash), up to term 2, no crash, under any interleaving, grant lapses included: c wins term 2 while a leads, and lease reads across that election.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
