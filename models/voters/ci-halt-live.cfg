\* a leading the joint configuration (JointInit), every replica up, no crash, and the leader of any term may halt at an entry it cannot decode: its node still holds it and renews its followers' grants, so only its hand-off gives the group a leader in Plan that has not halted, or, when that election fails and it steps down, its node telling the followers that ask that it is gone; up to term 4, since the election after a failed hand-off may be the dropped voter's, which hands off in turn; and the dropped voter, which applied its removal, keeps its state until the plan is complete, so a leader that holds the leave but applied only the joint configuration commits on it.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 4
    MaxCrashes = 0
    MaxHalts = 1
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
PROPERTY
    NewLeader
