\* a leading the joint configuration (JointInit), up to term 2, and one crash of any replica, which restarts from a base at or below what it applied, with the commit index its hard state was last written with; no leader fortified, as in ci-swap: deep-lease checks lease reads across a restart.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 1
    MaxHalts = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    VotersCaughtUp
    DeletesOnlyRemoved
