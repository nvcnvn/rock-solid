\* ci-lease with one replica that halts at an entry it cannot decode, up to term 2: a halted leader hands its leadership on while its followers still support it, and lease reads across the hand-off.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    MaxHalts = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
