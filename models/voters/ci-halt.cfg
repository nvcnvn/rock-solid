\* ci-lease with one replica that halts at an entry it cannot decode, up to term 2: a halted leader hands its leadership on while its followers still support it, or steps down when that election fails and its followers drop their support once its node answers that it is gone, and lease reads across either.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    MaxHalts = 1
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
