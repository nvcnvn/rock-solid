    Plan2 = {}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = FALSE
    DurableConfCommit = FALSE
    RemovedStaysVoter = TRUE
CONSTRAINT Unfortified KeptFollowerCrashes
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    VotersCaughtUp
    DeletesOnlyRemoved
