\* expect: NewLeader
\* ci-leave-die-live from LeaveInit with RemovedStaysVoter off: c applies its removal and campaigns no more; b wins term 3 before applying the leave, gives c an entry of it and dies, so a and d, which applied only the joint configuration, need c's vote and never win it.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 5
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = FALSE
    ReportsLeave = TRUE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
PROPERTY
    NewLeader
