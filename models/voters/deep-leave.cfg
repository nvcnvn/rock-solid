\* ci-leave up to term 4, no leader fortified: c can win term 4 in the joint configuration after another voter won term 3, under any interleaving.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 4
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
