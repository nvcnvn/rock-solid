\* Voter c's drive moved, a leading the joint configuration with every replica up: a may crash and restart, so c can win and commit its own removal while its commit reaches no follower; after the swap the group has a leader in Plan, up to term 3. Lease reads never overlap.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
PROPERTY
    NewLeader
