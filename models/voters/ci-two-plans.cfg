\* From LeaveInit, c leading term 2 having committed the leave on b and d, a lagging, b down for good from the start, so the first plan never completes, and a second plan, swapping e in for b, taking over as the first's leave commits, while c, which the first drops, still lives and can lead the joint configuration; no crash, up to term 3, under any interleaving, grant lapses included, safety only: two plans overlapping elect no two leaders of a term, lose no committed entry and serve no overlapping lease reads, and c is deleted only once every voter of the second plan applied its leave, which Delete's guard states and no property here checks.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d, e}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {a, d, e}
    Stopped = {b}
    MaxTerm = 3
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
