\* expect: NewLeader
\* ci-halt-live with HaltedGone off: a, leading and fortified by b, c and d, commits the leave on a and b and halts at it; its hand-off to b fails, raising b's term, and a steps down on hearing it; c and d, their grants to a's node renewed, support a for good, so b wins no quorum of either half and no replica leads again.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 4
    MaxCrashes = 0
    MaxHalts = 1
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = FALSE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
PROPERTY
    NewLeader
