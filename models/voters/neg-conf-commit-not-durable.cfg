\* expect: ReportsHold
\* ci-restart with DurableConfCommit off: a Ready that commits the leave writes no hard state, so b, having applied the leave and reported it, crashes and restarts below the leave, back in the joint configuration.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    DurableConfCommit = FALSE
    RemovedStaysVoter = TRUE
CONSTRAINT Unfortified KeptFollowerCrashes
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    VotersCaughtUp
    DeletesOnlyRemoved
