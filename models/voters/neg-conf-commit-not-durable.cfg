\* expect: ReportsHold
\* ci-restart with DurableConfCommit off: a commits the leave on a and b, b hears that commit from an append with no entry, which writes no hard state, applies the leave and reports it, then crashes and restarts from a base below the leave with the commit index its append of the leave wrote, back in the joint configuration.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = FALSE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CONSTRAINT Unfortified KeptFollowerCrashes
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    VotersCaughtUp
    DeletesOnlyRemoved
