\* expect: AtMostOneLeader
\* ci-restart with DurableCommit off: a replica restarts with its base's commit index alone, below a committed configuration change its log holds, and campaigns under the configuration before it.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = FALSE
    RemovedWaitsForPlan = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CONSTRAINT Unfortified KeptFollowerCrashes
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    VotersCaughtUp
    DeletesOnlyRemoved
