\* expect: NewLeader
\* ci-leave-die-live with ReportsLeave off: c applies its removal and commits the leave on a, which applies it; b and d apply the joint configuration and report it, and b dies; c hands its leadership to d and is deleted, so d, which applied only the joint configuration, leads an outgoing half that, b dead and c gone, never commits.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 5
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = FALSE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveUnappliedInit
PROPERTY
    NewLeader
