\* from LeaveInit, c leading term 2 having committed the leave on b and d, a lagging, every replica up, no crash, no leader fortified, up to term 5, and any one replica dying for good: c can hold the outgoing half's newest entry after its removal committed, and stays a voter of the joint configuration, so it wins the votes a and d need and hands its leadership on.
