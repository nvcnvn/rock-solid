    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 5
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
