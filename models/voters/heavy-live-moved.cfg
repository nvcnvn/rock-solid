\* Voter c's drive moved, from the start to another node: c runs while d is swapped in for it, one leader may crash and restart, and leaders hand off; after the swap the group has a leader in Plan, up to term 4.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 4
    MaxCrashes = 1
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    DurableConfCommit = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    VotersCaughtUp
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
PROPERTY
    NewLeader
