\* From LeaveInit, c leading term 2 having committed the leave on b and d, a lagging, b down for good from the start, so the first plan never completes, and a second plan, swapping e in for b, taking over as the first's leave commits, while c, which the first drops, still lives; no crash, no leader fortified, up to term 4: the second plan commits, a voter of it leads its configuration, and c is deleted only once every voter of the second plan applied its leave.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d, e}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {a, d, e}
    Stopped = {b}
    MaxTerm = 4
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CONSTRAINT Unfortified
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
PROPERTY
    NewLeader
