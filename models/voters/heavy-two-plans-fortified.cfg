\* deep-two-plans with leaders fortified, every replica up: b and c, each dropped by one plan, fortify leaders of different joint configurations, and lease reads span both plans. Run at a milestone.
SPECIFICATION Spec
CONSTANTS
    Replicas = {a, b, c, d, e}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {a, d, e}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- LeaveInit
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    DeletesOnlyRemoved
    OneLeaseReader
    LeaseReadsCurrent
