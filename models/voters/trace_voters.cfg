\* Trace validation; the run's values come from the generated module trace_data.
SPECIFICATION TraceSpec
CONSTANTS
    Replicas <- TReplicas
    BaseVoters <- TBaseVoters
    Plan <- TPlan
    Plan2 = {}
    Stopped = {}
    MaxTerm <- TMaxTerm
    MaxCrashes <- TMaxCrashes
    MaxHalts <- TMaxHalts
    MaxDeaths <- TMaxDeaths
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = TRUE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
    ReportsLeave = TRUE
CHECK_DEADLOCK FALSE
\* TraceIncomplete comes last: at the end of a trace the others are checked first. The lease
\* invariants are left out: no line reads a lease, and the spec's count of support runs ahead of
\* the code's, which ends and comes back on the node-pair lease with no line.
INVARIANTS
    TypeOK
    AtMostOneLeader
    CommittedNeverLost
    CommittedAgree
    ReportsHold
    VotersCaughtUp
    DeletesOnlyRemoved
    LearnsOnlyRemoved
    TraceIncomplete
