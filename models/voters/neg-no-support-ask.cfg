    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Plan2 = {}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 0
    MaxHalts = 0
    MaxDeaths = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = FALSE
    HaltedGone = TRUE
    RemovedStopsLease = TRUE
    HaltHandsOff = TRUE
    DurableCommit = TRUE
    RemovedWaitsForPlan = TRUE
    NewestHardState = TRUE
    DurableConfCommit = TRUE
    RemovedStaysVoter = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- OutgoingInit
PROPERTY
    NewLeader
