\* expect: NewLeader
\* ci-live-moved with AskLeaderNode off: c, leading from the outgoing half, applies its own removal and deletes its state, and its followers, even those that applied the removal too, support it for good.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 2
    MaxCrashes = 0
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = FALSE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- OutgoingInit
PROPERTY
    NewLeader
