\* expect: NewLeader
\* ci-live-moved with AskLeaderNode off: a leader from the outgoing half applies its removal before any follower learns the commit, and they support it for good.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {a, b, c, d}
    BaseVoters = {a, b, c}
    Plan = {a, b, d}
    Stopped = {}
    MaxTerm = 3
    MaxCrashes = 1
    LearnerFirst = TRUE
    CatchUpFirst = TRUE
    OwnTermFirst = TRUE
    OneAtATime = TRUE
    JointQuorum = TRUE
    CampaignApplied = TRUE
    DeleteOnCommitted = TRUE
    NoticeIndex = TRUE
    NoticeMember = TRUE
    AskLeaderNode = FALSE
    RemovedStopsLease = TRUE
CHECK_DEADLOCK FALSE
CONSTANTS
    Init <- JointInit
PROPERTY
    NewLeader
