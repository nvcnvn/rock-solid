\* Give-up of one chunk of two in a PG: ci-giveup-stopped's plan with W1 on chunk 2 and a write to
\* chunk 1, both in PG 2, so an unfound give-up of chunk 2 must keep chunk 1's write.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes4
    PG <- OnePG
    Chunk <- Chunks2
    ChunkPG <- ChunksInPG2
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- GiveUpTwoChunksPlans
    MaxSend = 1
    MaxTable = 4
    Spare = 0
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    ReadsMapped
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
    GiveUpOnlyLost
