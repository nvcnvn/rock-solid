\* Parks: 4 nodes, PG 2 alone with its chunk, the first partial write: a refill member parked
\* beside the leaving member it replaced, then both removed; ci-parks-lost has the other member lost.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes4
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ParkOnePlans
    MaxSend = 1
    MaxTable = 8
    Spare = 0
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
