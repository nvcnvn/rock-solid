\* Trace validation; the run's values come from the generated module trace_data.
SPECIFICATION TraceSpec
CONSTANTS
    Node <- TNode
    PG <- TPG
    Chunk <- TChunk
    ChunkPG <- TChunkPG
    Blocks <- TBlocks
    MinLive <- TMinLive
    Maint <- TMaint
    InitMem <- TInitMem
    Plans <- TPlanSet
    RawRates <- TRates
    Slews <- TSlews
    Ver <- TVer
    IvOfV <- TIvOfV
    Cnt <- TCnt
    MaxSend = 100000
    MaxTable = 100000
    Spare = 100000
    MaxCounter = 1000000
    MaxFormat = 1
    MaxRestart = 100000
    MaxTerm = 0
    MaxFault = 100000
    Moves = {"fold"}
    Clocks = FALSE
    MaxTime = 0
    Bugs = {}
    TornLists = TRUE
CHECK_DEADLOCK FALSE
\* TraceIncomplete comes last: at the end of a trace the others are checked first.
\* OneReader, ReadsAcked and ReadsMapped rest on leases and NoResurrectedWrite on
\* a reissued write, which no line of a trace moves or holds.
INVARIANTS
    NoLateCompletion
    DropsAreSuffix
    VersionsGrow
    UnchangedIntervalAccepts
    AtEndCommitted
    AtEndOneWrite
    AtEndMerges
    AtEndTables
    TraceIncomplete
