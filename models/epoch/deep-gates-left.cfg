\* ci-gates-left with its disk put back into the PG: the restarted leaving member's replayed write, dropped
\* in memory once no interval names its disk, is gated again by a second restart. Too large for ci.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- LeftBackPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 3
    MaxTerm = 0
    MaxFault = 2
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    NothingCommittedDropped
    DropsAreSuffix
    NoResurrectedWrite
    ReadsAcked
    NoStranded
