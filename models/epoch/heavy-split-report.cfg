\* ci-split-report's constants with disk 1 marked down before the split, the plan on which
\* neg-report-across-split loses the write. Too large for ci.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes2
    PG <- PGs
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive1
    Maint <- NoMaint
    InitMem <- MemPool2
    Plans <- SplitReportPlans
    MaxSend = 1
    MaxTable = 6
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
