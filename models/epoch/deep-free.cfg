\* The free plan at 4 nodes: any two membership changes at any time, with one
\* partial write and a restart, and the unbounded liveness property.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes4
    PG <- PGs
    Chunk <- Chunks2
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- FreePlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"down", "up", "maint", "replace", "rotate", "fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
PROPERTIES
    Monotonic
    PeeringSettles
