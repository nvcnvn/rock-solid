\* Resent writes, as ci-resend, with a member refusal ending the interval under a
\* primary that stays, and a third send, so a lost reanswer is sent again.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- FirstPG
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ResendFailPlans
    MaxSend = 3
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    AppliedOnce
    IdsLogged
    PrimarySource
    NoStranded
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    ReadsAcked
    ReadsMapped
PROPERTIES
    AckedOnMinLive
    Monotonic
