\* expect: ReadsAcked
\* The primary takes its copy for its image though the version its last recovery was logged under
\* is dropped: disk 2, back in interval 3, is recovered under Y, which disk 3 lacks; restarted and
\* made primary, it drops Y and the copied X with it, and serves no X.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- FirstPG
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- DroppedRecoveryPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 1
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"ImageOverDroppedRecovery"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    ReadsAcked
