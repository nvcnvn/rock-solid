\* Bounce: ci-image's move, then the primary's disk marked down and up, so the other member is
\* primary for an interval and the primary loses its lead with Y pending, then the format.
\* ci-bounce with the table after the format and a counter of 2. Too large for ci.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- BouncePlans
    MaxSend = 1
    MaxTable = 6
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
