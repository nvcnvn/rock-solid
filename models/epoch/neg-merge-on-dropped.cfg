\* expect: MergesOnKept
\* A new primary merges on a version it mapped that peering dropped, as if it were gated.
\* At min_live 1: at 2 the write it needs waits, its chunk having too few clean copies.
\* With ListerOrders too: the hold on a primary that lists the chunk holds the write, and its recovery
\* from its own image at a kept version above 0, which keeps the dropped version, is not reached within these bounds.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- PGs
    Chunk <- Chunks2
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive1
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- PeerPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"ListerOrders", "MergeOnDropped"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    MergesOnKept
