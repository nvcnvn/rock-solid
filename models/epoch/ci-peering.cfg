\* Peering-heavy: 3 nodes, PG 1 (rep3) and PG 2 (rep2, maintenance), a chunk
\* in each, lease expiry left open, every membership plan of PeerPlans.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- PGs
    Chunk <- Chunks2
    ChunkPG <- ChunkInPG
    Blocks <- Blocks21
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- PeerPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
PROPERTIES
    Monotonic
