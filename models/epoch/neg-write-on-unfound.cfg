\* expect: HeldWritesOrdered
\* A write to an unfound chunk is held, not refused: W1 on disk 2 alone, disk 3 back listing the chunk, disk 2 down, and W2 waits at disk 3, which lists it, for a recovery with no source.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive1
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- UnfoundPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"WriteOnUnfound"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    HeldWritesOrdered
