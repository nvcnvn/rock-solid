\* The delayed-message lease plan alone, at 3 nodes with the constants of
\* ci-leases but time to 5 s: messages delayed any time make it the largest.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- PGs
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- SlowPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 2
    MaxFault = 2
    Moves = {"fold"}
    Clocks = TRUE
    RawRates <- LeaseRates
    Slews <- LeaseSlews
    MaxTime = 500
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    OneLeaseholder
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    LeaseForms
PROPERTIES
    Monotonic
