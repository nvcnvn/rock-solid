\* Peering at 4 nodes: every plan of ci-peering and any membership change at
\* any time, with the unbounded liveness property.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes4
    PG <- PGs
    Chunk <- Chunks2
    ChunkPG <- ChunkInPG
    Blocks <- Blocks21
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- DeepPeerPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"down", "up", "maint", "replace", "rotate", "fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
PROPERTIES
    Monotonic
    PeeringSettles
