\* Every activated primary has a source: a primary that lists the chunk orders a write. No spare table, to fit 5 minutes; deep-sources-lister has one.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- FirstPG
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ListerOrderPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    NoStranded
    NothingCommittedDropped
    DropsAreSuffix
    MergesOnKept
    ReadsAcked
    ReadsMapped
PROPERTIES
    AckedOnMinLive
