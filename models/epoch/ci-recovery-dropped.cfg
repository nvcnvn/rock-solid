\* A recovery dropped with its version: neg-image-over-dropped-recovery's plan, PG 1 and its
\* chunk alone, two whole writes to its one block, the second once the first is acknowledged, and
\* node 2 restarted once: the primary whose recovery's version peering drops takes no image.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- FirstPG
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- DroppedRecoveryPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 1
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    NothingCommittedDropped
    DropsAreSuffix
    ImageRecoveryKept
    NoStranded
    ReadsAcked
