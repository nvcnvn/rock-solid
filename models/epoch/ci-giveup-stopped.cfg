\* Give-up: 4 nodes, PG 2 alone with its chunk, both partial writes: both members down together and
\* refilled in one table, then declared lost, and the PG stopped or its chunk unfound given up.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes4
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- GiveUpStoppedPlans
    MaxSend = 1
    MaxTable = 4
    Spare = 0
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    ReadsMapped
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
    GiveUpOnlyLost
