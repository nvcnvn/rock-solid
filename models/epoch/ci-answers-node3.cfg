\* Answers under fairness with a restart: the recovering member. The restart is node 3's;
\* ci-answers and ci-answers-node2 restart the others, deep-answers any.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes3
    PG <- FirstPG
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ListerAnswer3
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    AckedOnMinLive
    IntervalEnds
    AllAnswered
