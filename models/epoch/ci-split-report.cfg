\* A report racing a split: 2 nodes, both PGs in one rep2 pool at min_live 1, PG 1's chunk with
\* one write; disk 2 down and back, then the split. An activation report from before the split, which
\* names the number another PG holds after it, can reach the leader after it.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes2
    PG <- PGs
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive1
    Maint <- NoMaint
    InitMem <- MemPool2
    Plans <- SplitRacePlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
