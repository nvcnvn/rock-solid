\* Refills: 3 nodes, PG 2 (rep2, maintenance) alone with its chunk, lease expiry left open,
\* a member refilled in the leaving form, two writes, the other member down while it leaves,
\* a format. MaxCounter 1, to fit 5 minutes, so the writes take an interval each; the restart is
\* in ci-refills-down-restart and -second, one write each; deep-refills-down has both.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- RefillDownFormatPlans
    MaxSend = 1
    MaxTable = 6
    Spare = 0
    MaxCounter = 1
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
