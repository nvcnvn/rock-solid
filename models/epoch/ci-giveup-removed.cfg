\* Give-up after a removal: 4 nodes, PG 2 alone with its chunk, one write: disk 4 joins in disk 3's place
\* and disk 3 is removed, then both members are lost and the stopped PG given up.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes4
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- GiveUpRemovedPlans
    MaxSend = 1
    MaxTable = 7
    Spare = 0
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 0
    MaxTerm = 0
    MaxFault = 0
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    ReadsMapped
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
    GiveUpOnlyLost
