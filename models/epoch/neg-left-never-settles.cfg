\* expect: LeftGatesSettle
\* A store that never drops a left PG's gated versions, on ci-gates-left's constants.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- LeftDownPlans
    MaxSend = 1
    MaxTable = 4
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"LeftNeverSettles"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    LeftGatesSettle
