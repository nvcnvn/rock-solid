\* Lease-heavy: 3 nodes, PG 1 (rep3) and PG 2 (rep2, maintenance), one chunk
\* of one block, whole-block writes, two clocks per node, every plan of
\* LeasePlans.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- PGs
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- LeasePlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 2
    MaxFault = 1
    Moves = {"fold"}
    Clocks = TRUE
    RawRates <- LeaseRates
    Slews <- LeaseSlews
    MaxTime = 900
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    OneLeaseholder
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    LeaseForms
PROPERTIES
    Monotonic
