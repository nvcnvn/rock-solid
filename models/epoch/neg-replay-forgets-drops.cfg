\* expect: NoStranded
\* Replay maps the versions its store dropped at a decision marker of an earlier run: a primary
\* restarted after the decision that dropped its own Y maps Y, so its next decision drops its
\* image, and the other member's disk goes before recovery. No fold, to fit 5 minutes.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ReplayDropsPlans
    MaxSend = 1
    MaxTable = 6
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 2
    Moves = {}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"ReplayForgetsDrops"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoStranded
