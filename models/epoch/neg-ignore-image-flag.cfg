\* expect: NoStranded
\* Replay ignores the missing-list entry's image flag: a primary restarted after the decision
\* that dropped its own Y forgets its image, and the other member's disk goes.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ImageRestartCutPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 2
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"IgnoreImageFlag"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoStranded
