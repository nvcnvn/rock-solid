\* Leases at 4 nodes: every lease plan but the delayed-message one, including
\* the pause, suspend and reboot plans ci-leases leaves out; node 4 is a voter
\* of the Raft group and a spare.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes4
    PG <- PGs
    Chunk <- Chunks1
    ChunkPG <- ChunkInPG1
    Blocks <- Blocks1
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- AllLeasePlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 2
    MaxFault = 2
    Moves = {"fold"}
    Clocks = TRUE
    RawRates <- LeaseRates
    Slews <- LeaseSlews
    MaxTime = 1100
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    OneLeaseholder
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    LeaseForms
PROPERTIES
    Monotonic
