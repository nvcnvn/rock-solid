\* Replay drops: the move, then the primary's restart, its next interval in a spare table
\* and the other member's format: neg-replay-forgets-drops' plan and constants, with folds. Too large for ci.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ReplayDropsPlans
    MaxSend = 1
    MaxTable = 6
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 2
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    ImageRecoveryKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
