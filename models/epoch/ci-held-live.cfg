\* A write held for its chunk's copies is ordered in the end, under fairness: recovery reaches the chunk. PG 2, a member in maintenance and back.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- HeldLivePlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    HeldWritesOrdered
    AckedOnMinLive
    AllAnswered
