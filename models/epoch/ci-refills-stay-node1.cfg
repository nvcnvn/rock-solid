\* Refills: 3 nodes, PG 2 (rep2, maintenance) alone with its chunk, lease expiry left open,
\* a member refilled in the leaving form, one write, the other member down while it leaves, a
\* restart of node 1. ci-refills-stay restarts node 2; deep-refills-stay any node.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- RefillStay1
    MaxSend = 1
    MaxTable = 6
    Spare = 0
    MaxCounter = 2
    MaxFormat = 0
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    PrimarySource
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
    NoStranded
PROPERTIES
    AckedOnMinLive
    Monotonic
    RemovalKeepsCopies
