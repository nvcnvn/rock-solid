\* expect: NothingCommittedDropped
\* A store drops a PG's gated versions once its disk leaves the current interval, while an earlier one
\* still names it: a replica restarted and replaced drops W, and its reply vetoes W at the next peering.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- ReplicaThenMaintPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {"SettleLeftEarly"}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    NothingCommittedDropped
