\* A write held while the primary lists the chunk is ordered in the end, under fairness: recovery reaches the primary's own copy. PG 2 at min_live 1, a member in maintenance and back, then made primary.
SPECIFICATION FairSpec
CONSTANTS
    Node <- Nodes3
    PG <- OnePG
    Chunk <- OneChunk
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive1
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- HeldLiveRotPlans
    MaxSend = 1
    MaxTable = 5
    Spare = 0
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 1
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
    TornLists = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    HeldWritesOrdered
    AckedOnMinLive
    AllAnswered
