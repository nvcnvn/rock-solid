\* Failures: ci-peering's constants, with a table more for the min_live plan,
\* and the plans of FaultPlans: a version failing at a member or on the
\* primary's own log, a disk formatted around peering and recovery, and a
\* min_live change.
SPECIFICATION Spec
CONSTANTS
    Node <- Nodes3
    PG <- PGs
    Chunk <- Chunks2
    ChunkPG <- ChunkInPG
    Blocks <- Blocks22
    MinLive <- MinLive2
    Maint <- MaintPG2
    InitMem <- Mem3
    Plans <- FaultPlans
    MaxSend = 1
    MaxTable = 6
    Spare = 1
    MaxCounter = 2
    MaxFormat = 1
    MaxRestart = 2
    MaxTerm = 0
    MaxFault = 2
    Moves = {"fold"}
    Clocks = FALSE
    RawRates <- Exact
    Slews <- NoSlew
    MaxTime = 0
    Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
    OneReader
    NoLateCompletion
    NothingCommittedDropped
    DropsAreSuffix
    OneWritePerVersion
    VersionsGrow
    UnchangedIntervalAccepts
    MergesOnKept
    TablesForward
    NoResurrectedWrite
    ReadsAcked
PROPERTIES
    Monotonic
